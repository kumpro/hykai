name: Deploy to GitHub Pages

# 휴대폰에서 쓰려면 https로 올라가 있어야 한다.
# 음성 인식은 https 또는 localhost에서만 마이크가 열리기 때문이다.
#
# main에 올라온 것만 배포한다. 작업 브랜치까지 배포하려 들면
# github-pages 환경의 보호 규칙에 막혀 실패 표시만 남는다.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 학습 내용을 JSON으로 뽑는다 — n8n이 이 파일을 읽어 매일 아침 발송한다
      - name: Export learning data
        run: node tools/export-json.js

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -r assets js data _site/
          touch _site/.nojekyll

      # 배포마다 고유한 버전 번호를 찍는다.
      # 서비스 워커는 이 번호가 바뀌어야 캐시를 통째로 새로 받는다 —
      # 그래야 폰에 설치된 앱이 새 버전으로 넘어간다.
      - name: Stamp build version
        run: |
          BUILD="$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          sed -i "s/__BUILD__/${BUILD}/g" _site/sw.js _site/js/version.js
          echo "배포 버전: ${BUILD}"
          grep -n "VERSION" _site/sw.js | head -1
          cat _site/js/version.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
